# modules/intents.yaml
#
# Embedding buckets for the semantic router.
#
# v0.7.0 — expanded from 4 to 14 intents. Embedding is now the
# primary routing mechanism for ALL intents. The tier-1 keyword
# table in semantic_router.py is being phased out in favour of
# these buckets.
#
# Thresholds (used by semantic_router.py v0.7.0):
#   fast_path_threshold  — score >= this AND non-arg-extraction intent
#                          → execute tool directly, bypass tool LLM
#   tool_llm_threshold   — score >= this but < fast_path, OR arg-extraction
#                          intent at any confidence → send to tool LLM
#   below tool_llm_threshold → treat as general, no tools
#
# arg_extraction_intents — intents that always go to the tool LLM
#   regardless of embedding confidence, because they require the LLM
#   to extract structured parameters (entity, action, duration, etc.)
#   from the message before execution.
#
# ==================================================

fast_path_threshold: 0.82
tool_llm_threshold:  0.60

arg_extraction_intents:
  - device_control
  - timer_alarm
  - media_control

# Per-intent confidence overrides (minimum score to claim that intent).
# 2026-10-07: tuned offline against ~800 labeled turns from the four test
# banks + hand-written commands (offline router eval), weighting a
# false trigger 1.5x a missed command. Chat about a topic (music, sleep,
# phones) scores 0.60-0.72 on these buckets; real commands score higher.
intent_confidence:
  device_control:  0.63
  ha_sensor:       0.61
  outside_weather: 0.65
  timer_alarm:     0.71
  media_control:   0.66
  local_search:    0.62
  verify_last:     0.63
  system_status:   0.62
  list_commands:   0.69
  unsupported:     0.71

# Sampling profile (config.yaml sampling_profiles) per intent for the
# conversational pass. main._pick_profile overrides at runtime:
#   a tool ran → relay · intent disabled → feature_off · think w/o room → factual
# Unlisted intents → chat. The tool LLM pass always uses the "router" profile.
intent_profiles:
  ha_sensor:       relay
  device_control:  relay
  outside_weather: relay
  timer_alarm:     relay
  media_control:   relay
  add_note:        relay
  web_search:      factual
  local_search:    factual
  verify_last:     factual
  finance_process: factual
  system_status:   factual
  list_commands:   factual
  clock:           factual
  knowledge:       factual
  chat_play:       chat
  chat_statement:  chat
  unsupported:     feature_off
  general:         chat
  think_mode:      think

